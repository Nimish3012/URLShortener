apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-shortener-api-deployment
  namespace: url-shortener-prod
  labels:
    app: url-shortener-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: url-shortener-api
  template:
    metadata:
      labels:
        app: url-shortener-api
    spec:
      containers:
        - name: url-shortener-api-container
          image: urlshortacr.azurecr.io/url-shortener-api:latest  # Updated image
          ports:
            - containerPort: 5000
          env:
            - name: BASE_URL
              value: "http://135.235.212.138"  # External IP or internal address
      imagePullSecrets:
        - name: acr-secret
